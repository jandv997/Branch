<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Scalp</title>
</head>
<body style="margin:0;padding:0;background-color:#030305;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#030305;padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;background-color:#08090f;border:1px solid #1a3a36;border-radius:16px;overflow:hidden;">
          <tr>
            <td style="height:4px;background-color:#2dd4bf;font-size:0;line-height:0;">&nbsp;</td>
          </tr>
          <tr>
            <td style="padding:32px 36px 12px;text-align:center;">
              <img src="https://quantumscalp.io/assets/img/logo/logo.png" alt="Quantum Scalp" width="56" height="56" style="display:block;margin:0 auto 14px;border-radius:12px;background-color:#0a0b10;border:1px solid #1a3a36;padding:6px;">
              <div style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;color:#ffffff;letter-spacing:-0.3px;">Quantum<span style="color:#2dd4bf;">Scalp</span></div>
              <div style="margin-top:12px;">
                <span style="display:inline-block;padding:6px 14px;border-radius:999px;border:1px solid #1a3a36;background-color:#0a0b10;color:#2dd4bf;font-family:Arial,Helvetica,sans-serif;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;">{{subject}}</span>
              </div>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 36px 8px;">
              <div style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:600;color:#f8fafc;margin-bottom:12px;">Hello, {{title}}.</div>
              <div style="font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.7;color:#cbd5e1;">{{body_email}}</div>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 36px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#0a0b10;border-left:3px solid #2dd4bf;border-radius:10px;">
                <tr>
                  <td style="padding:16px 18px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.7;color:#e2e8f0;">{{body_email_2}}</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:8px 36px 32px;">
              <a href="{{action_link}}" style="display:inline-block;background-color:#2dd4bf;color:#030305;text-decoration:none;font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:15px;padding:13px 28px;border-radius:999px;">{{action_btn}}</a>
            </td>
          </tr>
          <tr>
            <td style="padding:18px 36px 28px;border-top:1px solid #1a2330;text-align:center;font-family:Arial,Helvetica,sans-serif;color:#64748b;font-size:12px;">
              &copy; 2026 Quantum Scalp
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
